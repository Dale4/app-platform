name: Destroy environment

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment to destroy
        required: true
        type: choice
        options:
          - dev
          - test
      app:
        description: App to destroy (all = entire environment including network)
        required: true
        type: choice
        default: all
        options:
          - all
          - ConstFlow
          - ProFlow
          - WaterFlow

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install AWS CDK CLI
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-1' }}

      - name: Destroy environment
        run: |
          set -euo pipefail
          ENV="${{ inputs.env }}"
          APP="${{ inputs.app }}"
          if [ "$APP" = "all" ]; then
            npx cdk destroy --all -c "env=$ENV" --force
          else
            app_stacks=$(npx cdk ls -c "env=$ENV" -c "app=$APP" | grep -v -- '-Network$' || true)
            if [ -z "$app_stacks" ]; then
              echo "No app stack found for $APP in $ENV"
              exit 1
            fi
            # shellcheck disable=SC2086
            npx cdk destroy $app_stacks -c "env=$ENV" -c "app=$APP" --force
          fi
