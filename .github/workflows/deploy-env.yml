name: Deploy environment

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment to create or update
        required: true
        type: choice
        options:
          - dev
          - test
      app:
        description: App to deploy (all = every app in the environment)
        required: true
        type: choice
        default: all
        options:
          - all
          - ConstFlow
          - ProFlow
          - WaterFlow

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install AWS CDK CLI
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-1' }}

      - name: Deploy environment
        run: |
          if [ "${{ inputs.app }}" = "all" ]; then
            npx cdk deploy --all -c env=${{ inputs.env }} --require-approval never
          else
            npx cdk deploy --all -c env=${{ inputs.env }} -c app=${{ inputs.app }} --require-approval never
          fi

      - name: Publish frontends
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
        run: |
          set -euo pipefail
          ENV="${{ inputs.env }}"
          APP="${{ inputs.app }}"
          if [ "$APP" = "all" ]; then
            apps="ConstFlow ProFlow WaterFlow"
          else
            apps="$APP"
          fi
          label="$(printf '%s' "$ENV" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')"
          repo_parent="$(cd "$GITHUB_WORKSPACE/.." && pwd)"
          for app in $apps; do
            web="$repo_parent/$app/web"
            if [ ! -f "$web/package.json" ]; then
              echo "No web folder for $app at $web; skipping frontend publish."
              continue
            fi
            prefix="/$(printf '%s' "$app" | tr '[:upper:]' '[:lower:]')"
            echo "Building $app web ($prefix)"
            npm ci --prefix "$web"
            VITE_API_BASE_URL="$prefix" npm run build --prefix "$web"
            stack="AppPlatform-${label}-${app}"
            bucket="$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name "$stack" --query "Stacks[0].Outputs[?OutputKey=='FrontendBucket'].OutputValue | [0]" --output text)"
            distribution="$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name "$stack" --query "Stacks[0].Outputs[?OutputKey=='FrontendDistributionId'].OutputValue | [0]" --output text)"
            if [ -z "$bucket" ] || [ "$bucket" = "None" ] || [ -z "$distribution" ] || [ "$distribution" = "None" ]; then
              echo "Stack $stack did not publish FrontendBucket and FrontendDistributionId."
              exit 1
            fi
            aws s3 sync "$web/dist" "s3://$bucket" --delete --region "$AWS_REGION"
            aws cloudfront create-invalidation --region "$AWS_REGION" --distribution-id "$distribution" --paths "/*"
            echo "Published $app frontend."
          done
